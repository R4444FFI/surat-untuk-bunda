  <main>
    <header class="page-banner">
      <span class="eyebrow">Potongan cerita paling indah</span>
      <h1>Galeri kenangan Bunda</h1>
      <p>Setiap foto menyimpan cerita, kebersamaan, dan senyum yang selalu ingin kami ingat.</p>
    </header>
    <section class="section gallery-section">
      <div class="section-inner">
        <div class="gallery-grid">
          <figure class="photo-card reveal">
            <img src="WhatsApp%20Image%202026-10-22%20at%2021.24.30.jpeg" alt="Bunda tersenyum bersama anak di pusat perbelanjaan">
            <figcaption class="photo-caption">Senyum kesayangan</figcaption>
          </figure>
          <figure class="photo-card reveal">
            <img src="WhatsApp%20Image%202026-10-22%20at%2021.24.32.jpeg" alt="Bunda berfoto bersama anak-anak di depan cermin">
            <figcaption class="photo-caption">Momen bersama</figcaption>
          </figure>
          <figure class="photo-card reveal">
            <img src="WhatsApp%20Image%202026-10-22%20at%2021.24.28%20(1).jpeg" alt="Foto keluarga bersama Bunda saat makan bersama">
            <figcaption class="photo-caption">Kebersamaan yang hangat</figcaption>
          </figure>
          <figure class="photo-card reveal">
            <img src="WhatsApp%20Image%202026-10-22%20at%2021.24.28.jpeg" alt="Foto keluarga bersama di tempat wisata">
            <figcaption class="photo-caption">Petualangan keluarga</figcaption>
          </figure>
          <figure class="photo-card reveal">
            <img src="WhatsApp%20Image%202026-10-22%20at%2021.24.27.jpeg" alt="Bunda berfoto bersama Ayah di tempat wisata">
            <figcaption class="photo-caption">Foto Ayah dan Bunda</figcaption>
          </figure>
